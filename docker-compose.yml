services:
  mongo:
    image: mongo:7
    container_name: skillmatch-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: skillmatch-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      # Inside the compose network, reach Mongo by service name
      MONGODB_URI: mongodb://mongo:27017/skillmatch-1
      JWT_SECRET: dev-secret-change-me
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      # Notifications/AWS are optional for local dev
      ENABLE_CLOUDWATCH_METRICS: "false"
      NOTIFICATIONS_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
